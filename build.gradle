plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chillioil" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"minecraft_version": project.minecraft_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// Automatically copy the built remapped jar to the builds folder with version and MC version
tasks.register('copyJarToBuilds', Copy) {
	group = 'build'
	description = 'Copies the remapped mod jar to the builds folder.'
	dependsOn 'remapJar'

	from tasks.named('remapJar')
	into layout.projectDirectory.dir('builds')
	rename { String fileName ->
		"${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}.jar"
	}
}

// Automatically deploy the built jar to the Modrinth test profile mods directory, replacing older versions
tasks.register('copyToTestProfile') {
	group = 'build'
	description = 'Copies the remapped mod jar to the Modrinth test profile mods folder.'
	dependsOn 'remapJar'

	doLast {
		def targetDir = file('D:/game/MC/Modrinth/profiles/Testmod/mods')
		if (!targetDir.exists()) {
			targetDir.mkdirs()
		}

		try {
			// Delete any existing ChilliOil versions in the target mods directory
			targetDir.listFiles().each { File f ->
				if (f.name.startsWith(project.archives_base_name) && f.name.endsWith('.jar')) {
					f.delete()
				}
			}

			// Copy new remapped jar
			def sourceJar = tasks.named('remapJar').get().archiveFile.get().asFile
			def destName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}.jar"
			def destFile = new File(targetDir, destName)
			java.nio.file.Files.copy(sourceJar.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			println "Deployed ${destName} to ${targetDir.absolutePath}"
		} catch (Exception e) {
			println "Warning: Could not replace jar in ${targetDir.absolutePath} (Minecraft is likely currently running): ${e.message}"
		}
	}
}

tasks.named('build') {
	finalizedBy('copyJarToBuilds', 'copyToTestProfile')
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
